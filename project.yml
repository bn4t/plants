name: Plants

configs:
  Debug: debug
  Release: release

options:
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Plants:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Plants
    settings:
      base:
        PRODUCT_NAME: Plants
        PRODUCT_BUNDLE_IDENTIFIER: me.bn4t.plants
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Plants/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PlantsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PlantsTests
    dependencies:
      - target: Plants
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bn4t.plants.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Plants:
    build:
      targets:
        Plants: all
        PlantsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlantsTests
